<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Relatório Detalhado · Test Reports</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/bootstrap-table@1.22.6/dist/bootstrap-table.min.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/static/shared/style.css">
  <link rel="stylesheet" href="/static/report/style.css">
</head>
<body>
  <header class="topbar py-4 py-lg-5">
    <div class="container-xxl">
      <a class="brand-badge mb-3" href="/index.html">
        <span class="brand-dot"></span>
        Gradle Test Reports
      </a>
      <h1 class="display-6 fw-bold mb-2">Passo 4 — Relatório Detalhado</h1>
      <p class="mb-0 text-white-50 col-lg-8" id="resultBadge">Carregando…</p>
    </div>
  </header>

  <main class="container-xxl pb-5 hero">
    <section class="section-card">
      <nav class="crumbs mb-3" id="crumbs"></nav>
      <div id="errorAlert" class="alert alert-danger d-none" role="alert"></div>

      <div class="stat-row mb-3" id="summary"></div>

      <div id="loading" class="spinner-wrap">
        <div class="spinner-border spinner-border-sm" role="status"></div>
        Carregando testes…
      </div>

      <table id="tbl"
        data-search="true"
        data-show-columns="true"
        data-show-toggle="true"
        data-pagination="true"
        data-page-size="50"
        data-page-list="[25, 50, 100, 200, All]"
        data-sort-name="sec"
        data-sort-order="desc"
        data-sortable="true"
        data-filter-control="true"
        data-show-export="true"
        data-export-types="['csv','json']"
        data-classes="table table-bordered table-hover table-sm d-none">
        <thead class="table-light">
          <tr>
            <th data-field="cls" data-sortable="true" data-filter-control="select">Classe</th>
            <th data-field="test" data-sortable="true" data-filter-control="input">Teste</th>
            <th data-field="sec" data-sortable="true" data-formatter="durFmt" data-align="right" data-width="180">Duração</th>
            <th data-field="result" data-sortable="true" data-filter-control="select" data-formatter="resFmt" data-align="center">Resultado</th>
          </tr>
        </thead>
      </table>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://unpkg.com/bootstrap-table@1.22.6/dist/bootstrap-table.min.js"></script>
  <script src="https://unpkg.com/bootstrap-table@1.22.6/dist/locale/bootstrap-table-pt-BR.min.js"></script>
  <script src="https://unpkg.com/bootstrap-table@1.22.6/dist/extensions/filter-control/bootstrap-table-filter-control.min.js"></script>
  <script src="https://unpkg.com/bootstrap-table@1.22.6/dist/extensions/export/bootstrap-table-export.min.js"></script>
  <script src="https://unpkg.com/tableexport.jquery.plugin@1.28.0/tableExport.min.js"></script>
  <script src="/static/shared/app.js"></script>
  <script src="/static/report/script.js"></script>
</body>
</html>
