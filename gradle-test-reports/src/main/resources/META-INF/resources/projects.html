<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Projetos Gradle · Test Reports</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/static/shared/style.css">
</head>
<body>
  <header class="topbar py-4 py-lg-5">
    <div class="container-xxl">
      <a class="brand-badge mb-3" href="/index.html">
        <span class="brand-dot"></span>
        Gradle Test Reports
      </a>
      <h1 class="display-6 fw-bold mb-2">Passo 2 — Projetos Gradle</h1>
      <p class="mb-0 text-white-50 col-lg-8" id="dirBadge">Carregando…</p>
    </div>
  </header>

  <main class="container-xxl pb-5 hero">
    <section class="section-card">
      <nav class="crumbs mb-3" id="crumbs"></nav>
      <div id="errorAlert" class="alert alert-danger d-none" role="alert"></div>

      <form id="dirForm" class="row g-2 align-items-stretch mb-4">
        <div class="col-md">
          <input type="text" class="form-control" id="dirInput" autocomplete="off" required>
        </div>
        <div class="col-md-auto">
          <button type="submit" class="btn btn-pb-action w-100">
            <i class="bi bi-arrow-repeat me-1"></i> Rebuscar

        </div>
      </form>

      <div id="content"></div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
  <script src="/static/shared/app.js"></script>
