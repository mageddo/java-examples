<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gradle Test Reports</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/static/shared/style.css">
</head>
<body>
  <header class="topbar py-4 py-lg-5">
    <div class="container-xxl">
      <div class="brand-badge mb-3">
        <span class="brand-dot"></span>
        Gradle Test Reports
      </div>
      <h1 class="display-6 fw-bold mb-2">Análise de Relatórios de Teste</h1>
      <p class="mb-0 text-white-50 col-lg-8">
        Informe um diretório para localizar os projetos Gradle e explorar seus resultados de teste.
      </p>
    </div>
  </header>

  <main class="container-xxl pb-5 hero">
    <section class="row justify-content-center">
      <div class="col-xl-8">
        <div class="section-card">
          <h2 class="section-title">Passo 1 — Diretório</h2>
          <p class="section-subtitle mb-3">Informe o caminho absoluto onde estão seus projetos Gradle.</p>
          <div id="errorAlert" class="alert alert-danger d-none" role="alert"></div>
          <form id="dirForm" class="row g-2 align-items-stretch">
            <div class="col-md">
              <input type="text" class="form-control" id="dirInput"
                     placeholder="/Users/voce/dev/meu-projeto" autocomplete="off" required>
            </div>
            <div class="col-md-auto">
              <button type="submit" class="btn btn-pb-action w-100">
                <i class="bi bi-search me-1"></i> Analisar
              </button>
            </div>
          </form>
        </div>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
  <script src="/static/shared/app.js"></script>
  <script src="/static/home/script.js"></script>
</body>
</html>
